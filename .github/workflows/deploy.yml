name: Validate and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://game-developer-challenge.pages.dev
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_USE_MSW: 'false'
      - name: Deploy to existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.148.0'
          command: pages deploy dist --project-name game-developer-challenge --branch main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify public endpoints
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 https://game-developer-challenge.pages.dev/ > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 https://game-developer-challenge.pages.dev/api/ranking > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 'https://game-developer-challenge.pages.dev/api/history?playerId=ci-smoke' > /dev/null
